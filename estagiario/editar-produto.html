<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto - SACIT</title>
    <link rel="stylesheet" href="css/editar-produto.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700;800&family=Inter:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <input type="checkbox" id="openSidebarMenu">

    <label for="openSidebarMenu" class="sidebarIconToggle">
        <div class="spinner"></div>
        <div class="spinner"></div>
        <div class="spinner"></div>
    </label>

    <label for="openSidebarMenu" class="overlay"></label>
    <div class="page">
        <aside class="sidebar" id="sidebarMenu">
            <div class="sidebar-header">
                <img src="../img/avatar-menu.png" alt="Avatar" class="sidebar-avatar">
                <div>
                    <p class="sidebar-title">Nome</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="inicio-estagiario.html" class="menu-link">
                    <img src="../img/icone_inicio (1).png" alt="Início" class="menu-icon">
                    Início
                </a>
                <a href="perfil-estagiario.html" class="menu-link">
                    <img src="../img/icon_perfil.png" alt="Perfil" class="menu-icon perfil-icon">
                    Perfil
                </a>
                <a href="notificacao-estagiario.html" class="menu-link">
                    <img src="../img/icone_notificacao.png" alt="Notificações" class="menu-icon">
                    Notificações
                </a>
                <a href="consultar-produto.html" class="menu-link">
                    <img src="../img/icon_consultar_produto (1).png" alt="Consultar Produto" class="menu-icon">
                    Consultar Produto
                </a>
                <a href="controlar-estoque.html" class="menu-link">
                    <img src="../img/icone_controlar_estoque.png" alt="Controlar Estoque" class="menu-icon">
                    Controlar Estoque
                </a>
                <a href="controlar-produto.html" class="menu-link">
                    <img src="../img/icone_controlar_produto.png" alt="Controlar Produto" class="menu-icon">
                    Controlar Produto
                </a>
                <a href="sair.html" class="menu-link logout-link">
                    <img src="../img/icone_sair.png" alt="Sair" class="menu-icon">
                    Sair
                </a>
            </nav>
        </aside>

        <main class="content">
            <header class="page-header">
                <div class="header-title">
                    <div class="title-flag"></div>
                    <div>
                        <h1>Controlar Produto</h1>
                        <p>Gerencie os produtos do sistema</p>
                    </div>
                </div>
                <img src="../img/logo-sacit.png" alt="SACIT" class="brand-logo">
            </header>

            <section class="edit-card">
                <div class="card-top">
                    <h2>Editar Produto</h2>
                    <a href="controlar-produto.html" class="close-btn" aria-label="Fechar">
                        <img src="../img/fechar.png" alt="Fechar">
                    </a>
                </div>

                <div class="upload-block">
                    <div class="upload-placeholder">
                        <img src="../img/adicionar-img.png" alt="Adicionar imagem" class="upload-icon">
                    </div>
                </div>

                <form class="product-form">
                    <label class="field-label" for="product-name">Nome</label>
                    <input id="product-name" type="text" placeholder="Nome do produto" class="field-input">

                    <div class="field-row">
                        <div class="field-group">
                            <label class="field-label" for="category">Categoria</label>
                            <select id="category" class="field-input select-field">
                                <option>Eletrônico</option>
                                <option>Materiais</option>
                                <option>Informática</option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label class="field-label" for="location">Localização</label>
                            <select id="location" class="field-input select-field">
                                <option>Armário X</option>
                                <option>Almoxarifado</option>
                                <option>Laboratório</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field-group">
                            <label class="field-label" for="quantity">Quantidade</label>
                            <input id="quantity" type="number" placeholder="00" class="field-input">
                        </div>
                        <div class="field-group">
                            <label class="field-label" for="status">Status</label>
                            <select id="status" class="field-input select-field">
                                <option>Indisponível</option>
                                <option>Disponível</option>
                            </select>
                        </div>
                    </div>

                    <label class="field-label" for="description">Descrição</label>
                    <textarea id="description" rows="5" placeholder="Descrição do produto"
                        class="field-input textarea-field"></textarea>

                    <div class="actions-row">
                        <a href="excluir-produto.html" class="btn btn-danger">Excluir Produto</a>
                        <button type="button" class="btn btn-secondary">Gerar QRcode</button>
                    </div>

                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </form>
            </section>
        </main>
    </div>

    <footer class="footer">
        <nav class="footer-links">
            <a href="inicio-estagiario.html">Início</a>
            <a href="/coordenador/sobreNos.html">Sobre nós</a>
            <a href="consultar-prod-estagiario.html">Consultar Produto</a>
        </nav>

        <div class="footer-center">
            <img src="../img/ifro-logo.webp" alt="IFRO Logo" class="footer-logo">
        </div>

        <div class="footer-contact">
            <p>Contatos:</p>
            <p>Telefone: (99) 99999-9999</p>
            <p>E-mail: algumacoisa@ifro.edu.br</p>
        </div>
    </footer>
</body>

</html>
