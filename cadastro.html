<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SACIT</title>
    <link rel="stylesheet" href="css/cadastro.css" type="text/css">
</head>
<body>
    <div class="register-container">
        <div class="register-wrapper">
            <!-- Lado esquerdo - Opções de Cadastro -->
            <div class="register-left">
                <h1 class="register-title">Cadastro</h1>
                
                <div class="register-options">
                    <a class="register-btn" href="cad-servidor.html">
                        <span class="register-btn-text">Servidor</span>
                    </a>
                    <a class="register-btn" href="cad-coordenador.html">
                        <span class="register-btn-text">Coordenador</span>
                    </a>
                    <a class="register-btn" href="cad-estagiario.html">
                        <span class="register-btn-text">Estagiário</span>
                    </a>
                </div>
            </div>

            <!-- Lado direito - Logo -->
            <div class="register-right">
                <div class="logo-container">
                    <img alt="SACIT Logo" 
                         class="logo-image" 
                         src="img/logo-sacit.png">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
