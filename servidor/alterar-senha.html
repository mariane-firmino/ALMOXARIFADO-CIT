<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - SACIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&family=Inter:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/alterar-senha.css">
</head>

<body>
    <input type="checkbox" id="openSidebarMenu">

    <label for="openSidebarMenu" class="sidebarIconToggle">
        <div class="spinner"></div>
        <div class="spinner"></div>
        <div class="spinner"></div>
    </label>

    <label for="openSidebarMenu" class="overlay"></label>

    <div class="page">
        <aside class="sidebar" id="sidebarMenu">
            <div class="sidebar-header">
                <img src="../img/avatar-menu.png" alt="Avatar" class="sidebar-avatar">
                <div>
                    <p class="sidebar-title">Nome</p>
                </div>
            </div>

            <nav>
                <a href="inicio-servidor.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icone_inicio (1).png" alt="Icone Início" class="menu-icon">
                    </span>
                    Início
                </a>
                <a href="perfil-servidor.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icon_perfil.png" alt="Icone Perfil" class="menu-icon perfil-icon">
                    </span>
                    Perfil
                </a>
                <a href="notificacao-servidor.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icone_notificacao.png" alt="Icone Notificações" class="menu-icon">
                    </span>
                    Notificações
                </a>
                <a href="solicitacao-servidor.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icone_analisar_solicitacao.png" alt="Icone Solicitação" class="menu-icon">
                    </span>
                    Minhas Solicitações
                </a>
                <a href="consultar-produto.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icon_consultar_produto (1).png" alt="Icone Consultar Produto"
                            class="menu-icon">
                    </span>
                    Consultar Produto
                </a>
                <a href="consultar-historico.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icon_historico.png" alt="Icone Consultar Histórico" class="menu-icon">
                    </span>
                    Consultar Histórico
                </a>
                <a href="acompanhar-status.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icon_status.png" alt="Icone Acompanhar Status" class="menu-icon">
                    </span>
                    Acompanhar Status
                </a>
                <a href="sair.html" class="menu-link">
                    <span class="icon">
                        <img src="../img/icone_sair.png" alt="Icone Sair" class="menu-icon">
                    </span>
                    Sair
                </a>
            </nav>
        </aside>

        <main class="content">
            <header class="page-header">
                <div class="title-group">
                    <div class="title-row">
                        <span class="title-mark"></span>
                        <h1>Meu Perfil</h1>
                    </div>
                    <p class="subtitle">Bem-vindo(a), Nome !</p>
                </div>
                <img src="../img/logo-sacit.png" alt="SACIT Logo" class="brand-logo" />
            </header>

            <section class="password-card">
                <div class="card-heading">
                    <h2>Meus Dados - Alterar Senha</h2>
                    <div class="section-line"></div>
                </div>

                <form class="password-form">
                    <div class="password-group">
                        <label for="current-password">Digite a senha atual:</label>
                        <div class="password-input-wrapper">
                            <input id="current-password" class="password-input" type="password" placeholder="">
                            <button type="button" class="password-toggle" data-target="current-password"
                                title="Mostrar/Ocultar senha">
                                <img src="../img/olhoAberto.png" alt="Mostrar senha" class="eye-icon">
                            </button>
                        </div>
                    </div>

                    <div class="password-group">
                        <label for="new-password">Digite a nova senha:</label>
                        <div class="password-input-wrapper">
                            <input id="new-password" class="password-input" type="password" placeholder="">
                            <button type="button" class="password-toggle" data-target="new-password"
                                title="Mostrar/Ocultar senha">
                                <img src="../img/olhoAberto.png" alt="Mostrar senha" class="eye-icon">
                            </button>
                        </div>
                    </div>

                    <div class="password-group">
                        <label for="confirm-password">Repita a nova senha:</label>
                        <div class="password-input-wrapper">
                            <input id="confirm-password" class="password-input" type="password" placeholder="">
                            <button type="button" class="password-toggle" data-target="confirm-password"
                                title="Mostrar/Ocultar senha">
                                <img src="../img/olhoAberto.png" alt="Mostrar senha" class="eye-icon">
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <footer class="footer">
        <nav class="footer-links">
            <a href="inicio-servidor.html">Início</a>
            <a href="/coordenador/sobreNos.html">Sobre nós</a>
            <a href="#">Consultar Produto</a>
        </nav>

        <div class="footer-center">
            <img src="../img/ifro-logo.webp" alt="IFRO Logo" class="footer-logo">
        </div>

        <div class="footer-contact">
            <p>Contatos:</p>
            <p>Telefone: (99) 99999-9999</p>
            <p>E-mail: algumacoisa@ifro.edu.br</p>
        </div>
    </footer>

    <script>
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = button.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = button.querySelector('img');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.src = isPassword ? '../img/olhoFechado.png' : '../img/olhoAberto.png';
                icon.alt = isPassword ? 'Ocultar senha' : 'Mostrar senha';
            });
        });
    </script>
</body>

</html>
