<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto - SACIT</title>
    <link rel="stylesheet" href="css/editar-produto.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700;800&family=Inter:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <input type="checkbox" id="openSidebarMenu">

    <label for="openSidebarMenu" class="sidebarIconToggle">
        <div class="spinner"></div>
        <div class="spinner"></div>
        <div class="spinner"></div>
    </label>

    <div class="page">
        <aside class="sidebar" id="sidebarMenu">
            <div class="sidebar-header">
                <img src="../img/avatar-menu.png" alt="Avatar" class="sidebar-avatar">
                <div>
                    <p class="sidebar-title">Nome</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="inicio-estagiario.html" class="menu-link">
                    <img src="../img/icone_inicio (1).png" alt="Início" class="menu-icon">
                    Início
                </a>
                <a href="perfil-estagiario.html" class="menu-link">
                    <img src="../img/icon_perfil.png" alt="Perfil" class="menu-icon perfil-icon">
                    Perfil
                </a>
                <a href="notificacao-estagiario.html" class="menu-link">
                    <img src="../img/icone_notificacao.png" alt="Notificações" class="menu-icon">
                    Notificações
                </a>
                <a href="controlar-estoque.html" class="menu-link">
                    <img src="../img/icone_controlar_estoque.png" alt="Controlar Estoque" class="menu-icon">
                    Controlar Estoque
                </a>
                <a href="controlar-produto.html" class="menu-link">
                    <img src="../img/icone_controlar_produto.png" alt="Controlar Produto" class="menu-icon">
                    Controlar Produto
                </a>
                <a href="sair.html" class="menu-link logout-link">
                    <img src="../img/icone_sair.png" alt="Sair" class="menu-icon">
                    Sair
                </a>
            </nav>
        </aside>

        <main class="content">
        <header class="page-header">
            <div class="title-group">
                <div class="title-row">
                    <span class="title-mark"></span>
                    <h1>Editar Produto</h1>
                </div>
                <p class="subtitle">Edite as informações do produto.</p>
            </div>
            <img src="../img/logo-sacit.png" alt="logo" class="brand-logo">
        </header>

        <section class="edit-panel">
            <form class="edit-form">
                <div class="media-row">
                    <div class="card-header">
                    <h2>Editar Produto</h2>

                    <a href="controlar-produto.html" class="close-btn">
                        <img src="../img/fechar.png" alt="Fechar">
                    </a>
                </div>
                    <div class="preview">
                        <div class="preview-box">
                            <img src="../img/adicionar-img.png" alt="preview"/>
                        </div>
                        <div class="preview-actions">
                            <a href="#" class="btn btn-secondaryo">Substituir imagem</a>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="field">
                            <label>Nome</label>
                            <input type="text" value="Nome do Produto" readonly>
                        </div>

                    <div class="field">
                        <label>Categoria</label>
                        <input type="text" value="Nome" readonly>
                    </div>

                    <div class="field">
                        <label>Localização</label>
                        <input type="text" placeholder="Ex.: Armário 3">
                    </div>

                    <div class="field">
                        <label>Quantidade</label>
                        <input type="number" min="0" value="00">
                    </div>

                    <div class="field full">
                        <label>Descrição</label>
                        <textarea rows="3" placeholder="Descreva o produto..."></textarea>
                    </div>
                </div>
                <div class="controls">
                        <div class="control-actions">
                            <a href="controlar-produto.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar alterações</button>
                        </div>

                    </div>

                </div>
            </form>
        </section>
    </main>
</div>

    <footer class="footer">
        <nav class="footer-links">
            <a href="inicio-estagiario.html">Início</a>
            <a href="/coordenador/sobreNos.html">Sobre nós</a>
            <a href="consultar-prod-estagiario.html">Consultar Produto</a>
        </nav>

        <div class="footer-center">
            <img src="../img/ifro-logo.webp" alt="IFRO Logo" class="footer-logo">
        </div>

        <div class="footer-contact">
            <p>Contatos:</p>
            <p>Telefone: (99) 99999-9999</p>
            <p>E-mail: algumacoisa@ifro.edu.br</p>
        </div>
    </footer>
</body>

</html>
