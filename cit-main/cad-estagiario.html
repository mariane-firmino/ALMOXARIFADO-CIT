<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Estagiário - SACIT</title>
    <link rel="stylesheet" href="css/cad-estagiario.css" type="text/css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700;800&family=Inter:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <div class="register-wrapper">
            <!-- Lado esquerdo - Formulário de cadastro -->
            <div class="register-left">
                <h1 class="register-title">Cadastro de Estagiário</h1>

                <form class="register-form">
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-input" placeholder="Nome Completo">
                    </div>

                    <div class="form-group">
                        <label class="form-label">E-mail Institucional</label>
                        <input type="email" class="form-input" placeholder="seuemail@instituicao.edu.br">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label class="form-label">Matrícula</label>
                            <input type="text" class="form-input" placeholder="00000000">
                        </div>
                        <div class="form-group half">
                            <label class="form-label">Curso</label>
                            <select class="form-input">
                                <option value="">Selecione o curso</option>
                                <option value="Informática">Informática</option>
                                <option value="Biotecnologia">Biotecnologia</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label class="form-label">Ano</label>
                            <select class="form-input">
                                <option value="">Selecione o ano</option>
                                <option value="1º Ano">1º Ano</option>
                                <option value="2º Ano">2º Ano</option>
                                <option value="3º Ano">3º Ano</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label class="form-label">Telefone</label>
                            <input type="tel" class="form-input" placeholder="(99) 99999-9999">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-input" placeholder="Digite sua senha">
                        </div>
                        <div class="form-group half">
                            <label class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-input" placeholder="Confirme sua senha">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="submit-text">Cadastrar</span>
                    </button>

                    <div class="footer-links">
                        <div class="link-row">
                            <span class="link-text">Já tem conta?</span>
                            <a href="index.html" class="link-blue">Fazer Login</a>
                        </div>
                        <div class="link-row">
                            <span class="link-text">Voltar para</span>
                            <a href="cadastro.html" class="link-blue">Tipos de Cadastro</a>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Lado direito - Logo -->
            <div class="register-right">
                <div class="logo-container">
                    <img alt="SACIT Logo"
                         class="logo-image"
                         src="img/logo-sacit.png">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
