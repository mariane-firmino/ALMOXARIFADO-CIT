<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SACIT</title>
    <link rel="stylesheet" href="css/index.css" type="text/css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700;800&family=Inter:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>
<body>
    <!-- Login Container -->
    <div class="login-container">
        <!-- Envolve as duas partes do login (branco e verde)-->
        <div class="login-wrapper">
            <!-- Lado esquerdo -->
            <div class="login-left">
                <h1 class="login-title">Login</h1>
                
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-input" placeholder="">
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-input" placeholder="">
                </div>

                <button class="submit-btn">
                    <span class="submit-text">Enviar</span>
                </button>

                <div class="footer-links">
                    <div class="link-row">
                        <span class="link-text">Esqueceu a senha?</span>
                        <a href="esqueciSenha.html" class="link-blue">Esqueci minha senha</a>
                    </div>
                    <div class="link-row">
                        <span class="link-text">Ainda não é cadastrado?</span>
                        <a href="cadastro.html" class="link-blue">Cadastre-se</a>
                    </div>
                </div>
            </div>

            <!-- Lado direito - Logo -->
            <div class="login-right">
                <div class="logo-container">
                    <img alt="SACIT Logo" 
                         class="logo-image" 
                         src="img/logo-sacit.png">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
