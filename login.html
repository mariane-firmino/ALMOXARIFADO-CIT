<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SACIT</title>
    <link rel="stylesheet" href="../ALMOXARIFADO-CIT/css/login.css" type="text/css">
</head>

<body>

    <div class="formulario">
        <div class="login">
            <h2>Login</h2>
            <form id="meuFormulario">
                <label>Usuário:</label>
                <input type="email" id="email" placeholder="Digite seu email.">
                <div class="erro" id="erroEmail"></div><br>

                <label>Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha.">
                <div class="erro" id="erroSenha"></div>

                <button type="submit">Enviar</button>
            </form>
            <div class="card">
                <div class="links">
                    <p>Esqueceu a senha?</p>
                    <a href="">Esqueci a senha.</a>
                </div>
                <div class="links">
                    <p>Ainda não é cadastrado?</p>
                    <a href="">Cadastre-se.</a>
                </div>
            </div>

        </div>
        <div class="logo-img">
            <img src="../ALMOXARIFADO-CIT/img/logo.png" alt="Logo SACIT">
        </div>
    </div>


</body>

</html>
